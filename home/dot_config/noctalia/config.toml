[nightlight]
enabled = true

[osd.kinds]
keyboard_layout = false

[shell]
avatar_path = "/home/mcbeeringi/.face"
date_format = "%F"
font_family = "monospace"
polkit_agent = true
settings_window_translucent = true
time_format = "%R"

    [shell.launcher]
    app_grid = true
    categories = false
    compact = true
    show_app_actions = true

    [shell.panel]
    shadow = false
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 16

    [shell.session]
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        label = "lock"
        shortcut = "l"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        label = "suspend"
        shortcut = "s"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        label = "exit"
        shortcut = "e"
        variant = "default"

        [[shell.session.actions]]
        action = "command"
        command = "systemctl kexec"
        countdown_seconds = 0.0
        enabled = true
        glyph = "reboot"
        label = "kexec"
        shortcut = "k"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        label = "reboot"
        shortcut = "r"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        label = "poweroff"
        shortcut = "p"
        variant = "destructive"

[theme]
community_palette = "One"
custom_palette = "6ca"
source = "custom"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/mcbeeringi/Pictures/wp"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/mcbeeringi/Pictures/wp/hanabi.jpg"

    [wallpaper.last]
    path = "/home/mcbeeringi/Pictures/wp/hanabi.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/mcbeeringi/Pictures/wp/hanabi.jpg"

[weather]
enabled = false

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.brightness]
show_label = false

[widget.clock]
format = "%F %R"

[widget.media]
album_art_only = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.volume]
show_label = false
