edge_margin=1
sleep_cmd=/usr/bin/systemctl suspend

battery_id=BAT1
clock=%F %T
show_tty=true

bigclock=en
border_fg=0x80000000
text_in_center=true
default_input=password
xinitrc=null
xsessions=null
clear_password=true

animation=dur_file
dur_file_path=/etc/ly/example.dur
dur_offset_alignment=bottomright
dur_x_offset=-1
dur_y_offset=-1

[cmd:F8]
name = screenshot
cmd = fbgrab /tmp/ly-$(date -Iseconds).png
