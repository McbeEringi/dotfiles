[audio]
enable_overdrive = true

[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.79999998211860657
    capsule = true
    capsule_thickness = 0.79999998584389687
    end = [ "media", "tray", "bluetooth", "network", "volume", "brightness", "battery" ]
    layer = "top"
    margin_edge = 4
    margin_ends = 4
    padding = 8
    reserve_space = true
    shadow = false
    smart_auto_hide = false
    start = [ "launcher", "workspaces" ]
    thickness = 32

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true

[calendar]
enabled = true
event_date_format = "%F"
event_time_format = "%R"

[control_center]
width = 960

    [control_center.calendar]
    show_week_numbers = true

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "lock-and-suspend" ]
pre_action_fade_seconds = 5

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 120.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 300.0

[location]
latitude = 35.700000000000003
longitude = 139.80000000000001

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
